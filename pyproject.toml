[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlanpi-menu-tui"
version = "0.1.0"
description = "Textual thin-mode TUI surface for wlanpi-menud"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "textual>=0.80",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.18",
]

[project.scripts]
wlanpi-menu-tui = "wlanpi_menu_tui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wlanpi_menu_tui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
